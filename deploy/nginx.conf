# chat-demo 静态站部署示例（nginx）
#
# 放到 /etc/nginx/conf.d/chat-demo.conf，改 server_name 与 root 即可。
# root 指向 dist/ 的内容（不是 dist 目录本身）。
#
# 两条缓存规则是这套产物的关键，别省：
#   · static/ 下文件名带内容哈希 → 可以 immutable，永久缓存
#   · index.html 不带哈希 → 必须 no-cache，否则更新后用户拿到「旧壳 + 新 chunk」，白屏
#
# 注意：这里**不要**加 CORS 头。跨域发生在「用户浏览器 → API 网关」，与托管静态文件的
# 这台服务器无关；给静态站加 CORS 解决不了任何问题，只会让人以为配过了。网关侧要放行的
# 头见 README「接自建网关前必须确认」。

server {
    listen      80;
    server_name chat.example.com;

    root  /srv/chat-demo;
    index index.html;

    charset utf-8;
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 入口壳：每次回源校验
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 带内容哈希的产物：长缓存
    location ~* ^/static/(js|css|media)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 单页应用：刷新子路由不 404（本应用是纯客户端路由，目前只有 /，留着不影响）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 许可证随产物分发（构建会把它复制到 dist/LICENSE）
    location = /LICENSE {
        add_header Cache-Control "public, max-age=86400" always;
    }
}

# 子路径部署（例如 https://example.com/my-org/chat-demo/）：
# 产物 publicPath 是 'auto'，按脚本自身地址推导资源路径，子路径直接可用。
# 推荐做法：把 dist 的内容放到 /srv/my-org/chat-demo/，root 指到父目录 /srv，
# 让 URI 与磁盘路径自然对齐——**不要用 alias**，正则 location 里 alias 很容易拼错。
